name: smoke

# The TULPAOBS_FAST tier: plumbing, dispatch and closed-form blocks, with every
# multi-seed fitting loop and NUTS sample skipped. Catches the class of breakage
# that sits outside whatever was last being worked on -- issue #148 turned five
# blocks red and went unnoticed between manual full runs.
#
# Runs against the INSTALLED package rather than load_all(), so an export that
# never reached NAMESPACE fails here too.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      MAKEFLAGS: "-j4"
      TULPAOBS_FAST: '1'
      # #151: devtools::test() can never run this package's suite in parallel --
      # it unconditionally passes load_package = "source" to every worker
      # (devtools:::load_package_for_testing()), so each of the N parallel
      # `callr` workers independently recompiles the C++ backend into the same
      # src/ tree, racing on the shared build artifacts (reproduced directly:
      # a cold src/ plus 2 concurrent load_all() workers corrupted the DLL
      # registration in under a minute). run-tests.R does not have that
      # problem: it already loads the INSTALLED package and passes
      # load_package = "installed" explicitly, so each worker does a plain
      # library(tulpaObs) -- a read of one already-built DLL, safe for any
      # number of concurrent workers. Parallel is enabled here for that reason.
      TESTTHAT_PARALLEL: 'true'
      NOT_CRAN: 'true'
      # Per-fit console progress bars interleave across parallel workers into
      # one unreadable log; nothing here can pass control$progress down to the
      # individual fits, so the default is flipped process-wide instead.
      TULPAOBS_PROGRESS: '0'

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::testthat
            any::loo
            any::MASS
            any::betareg
            any::dplyr
            any::ggplot2

      - name: Verify engine pin
        run: Rscript .github/scripts/check-engine-pin.R

      - name: Install package
        run: R CMD INSTALL --no-multiarch --with-keep.source .

      - name: Smoke suite
        run: Rscript .github/scripts/run-tests.R
