name: full-recovery

# The recovery tier: TULPAOBS_FAST unset, so the parameter-recovery and
# interval-coverage loops run across all seeds, plus the NUTS and spatial fits.
# This is the tier carrying the package's statistical evidence -- that the
# estimators recover simulated truth and the intervals cover at the nominal rate
# -- as opposed to the smoke tier, which only proves the plumbing holds.
#
# Hours, so on demand rather than on push.
#
# SHARDED (issue #178). As one job this tier was cancelled at the 350-minute cap
# on both of its scheduled runs and reported nothing either time, because the
# cost is concentrated in a few files -- one of them measured at 5.12h on its
# own, 88% of the cap. The suite is now split across jobs by
# .github/scripts/shard-tests.R, which packs the measured costs longest-first
# and gives the few files at or beyond the cap a job each. A shard that still
# overruns now costs only its own files: every other shard reports, and the
# aggregate job names what went unverified rather than letting a partial tier
# read as either green or as nothing at all.
#
# The shard plan is only as good as the numbers behind it, and most files have
# never been timed. The aggregate job publishes tier3-timings.csv, one row per
# test file; feed the expensive rows back into .github/tier3-weights.csv and the
# packing improves with every run.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Assignment is computed once, here, and each shard job re-derives it from the
  # same script rather than being handed a file list, so the matrix and the
  # per-shard filters cannot drift apart. Base R only: no deps, no install.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Shard plan
        run: Rscript .github/scripts/shard-tests.R summary

      - id: shards
        run: echo "shards=$(Rscript .github/scripts/shard-tests.R ids)" >> "$GITHUB_OUTPUT"

  recovery:
    needs: plan
    name: recovery (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      # One shard blowing the cap must not cancel the shards carrying the rest
      # of the tier's evidence -- that failure mode is the whole issue.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      MAKEFLAGS: "-j4"
      # #151: safe here because run-tests.R passes load_package = "installed"
      # (every worker does a plain library(tulpaObs), not a source recompile);
      # see smoke.yaml for the full explanation. This tier is the one #151 was
      # actually filed to unblock -- hours serial, and the whole point of
      # Config/testthat/parallel.
      TESTTHAT_PARALLEL: 'true'
      # skip_on_cran() guards the recovery loops; NOT_CRAN is what lets them run.
      NOT_CRAN: 'true'
      # tulpaMesh is a hard dependency here, so a mesh-install regression must
      # fail loudly instead of silently skipping the whole SPDE surface.
      TULPAOBS_REQUIRE_SPDE: '1'
      # The console progress bar defaults on and is set per fit, so nothing here
      # can reach the hundreds of fits this tier runs. Left on, their
      # per-iteration lines are most of the log and bury the failure output the
      # log is read for. The progress.file heartbeat channel is unaffected.
      TULPAOBS_PROGRESS: '0'
      # Which slice of the suite this job runs, and where it writes the results
      # the aggregate job collects.
      TULPAOBS_SHARD: ${{ matrix.shard }}
      TULPAOBS_TEST_OUT: tier3-out

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
          extra-repositories: https://gcol33.r-universe.dev

      # Before dependency resolution, because resolution is what fails when an
      # engine floor is not yet served and its error names no version at all
      # ("Can't install dependency tulpa (>= 0.0.117)"). This reports which
      # floor, what is served, and from where (issue #180).
      - name: Verify floor availability
        run: Rscript .github/scripts/check-floor-served.R

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::testthat
            any::loo
            any::MASS
            any::betareg
            any::dplyr
            any::ggplot2
            any::unmarked
            any::spAbundance

      # Every shard checks the pin. A shard is a full fit of the engine, so a
      # skew that only one job would have caught is no guard at all -- and the
      # shards no longer share a runner to inherit it from.
      - name: Check for issue-tracker references
        run: Rscript .github/scripts/check-issue-refs.R

      - name: Verify engine pin
        run: Rscript .github/scripts/check-engine-pin.R

      - name: Install package
        run: R CMD INSTALL --no-multiarch --with-keep.source .

      - name: Recovery shard
        run: Rscript .github/scripts/run-tests.R

      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier3-${{ matrix.shard }}
          path: tier3-out
          if-no-files-found: warn
          retention-days: 90

  aggregate:
    needs: [plan, recovery]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      # A tier where every shard was cancelled leaves nothing to download, and
      # the aggregate still has to run and say which shards went silent, so a
      # missing download is reported rather than fatal.
      - name: Collect shard results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: tier3-*
          path: tier3-artifacts

      - name: Aggregate
        run: Rscript .github/scripts/aggregate-tier3.R tier3-artifacts

      - name: Upload tier timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier3-timings
          path: |
            tier3-timings.csv
            tier3-tests.csv
          if-no-files-found: warn
          retention-days: 90
