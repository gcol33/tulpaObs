name: full-recovery

# The recovery tier: TULPAOBS_FAST unset, so the parameter-recovery and
# interval-coverage loops run across all seeds, plus the NUTS and spatial fits.
# This is the tier carrying the package's statistical evidence -- that the
# estimators recover simulated truth and the intervals cover at the nominal rate
# -- as opposed to the smoke tier, which only proves the plumbing holds.
#
# Hours, so weekly and on demand rather than on push.

on:
  schedule:
    - cron: '0 3 * * 6'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      MAKEFLAGS: "-j4"
      # #151: safe here because run-tests.R passes load_package = "installed"
      # (every worker does a plain library(tulpaObs), not a source recompile);
      # see smoke.yaml for the full explanation. This tier is the one #151 was
      # actually filed to unblock -- hours serial, and the whole point of
      # Config/testthat/parallel.
      TESTTHAT_PARALLEL: 'true'
      # skip_on_cran() guards the recovery loops; NOT_CRAN is what lets them run.
      NOT_CRAN: 'true'
      # tulpaMesh is a hard dependency here, so a mesh-install regression must
      # fail loudly instead of silently skipping the whole SPDE surface.
      TULPAOBS_REQUIRE_SPDE: '1'
      # The console progress bar defaults on and is set per fit, so nothing here
      # can reach the hundreds of fits this tier runs. Left on, their
      # per-iteration lines are most of the log and bury the failure output the
      # log is read for. The progress.file heartbeat channel is unaffected.
      TULPAOBS_PROGRESS: '0'

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::testthat
            any::loo
            any::MASS
            any::betareg
            any::dplyr
            any::ggplot2
            any::unmarked
            any::spAbundance

      - name: Verify engine pin
        run: Rscript .github/scripts/check-engine-pin.R

      - name: Install package
        run: R CMD INSTALL --no-multiarch --with-keep.source .

      - name: Full recovery suite
        run: Rscript .github/scripts/run-tests.R
